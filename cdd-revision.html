<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CDD Revision — BIOL21302</title>
<meta name="description" content="Adaptive Clinical Drug Development exam simulator and revision system." />
<style>
  :root{
    --bg:#0e1014; --bg-elev:#161a21; --bg-elev2:#1d222b; --bg-hover:#222833;
    --fg:#e6e9ef; --fg-mute:#a1a8b4; --fg-dim:#6e7686;
    --accent:#7aa7ff; --accent-2:#9d7aff; --accent-dim:#3a4d75;
    --good:#5fd49a; --warn:#f0c674; --bad:#f17a7a;
    --line:#262c36; --line-strong:#384151;
    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 6px 20px rgba(0,0,0,.35);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="light"]{
    --bg:#f7f8fa; --bg-elev:#ffffff; --bg-elev2:#f0f2f6; --bg-hover:#eef1f6;
    --fg:#15181d; --fg-mute:#4f5663; --fg-dim:#8089976e;
    --accent:#3866d6; --accent-2:#7647d4; --accent-dim:#c1d1f5;
    --good:#2a9d6a; --warn:#b07c1c; --bad:#c44545;
    --line:#e3e6ec; --line-strong:#c8cdd6;
    --shadow:0 1px 0 rgba(0,0,0,.02),0 4px 14px rgba(20,30,60,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--sans);-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  textarea{resize:vertical}
  code,kbd{font-family:var(--mono);background:var(--bg-elev2);padding:1px 5px;border-radius:4px;font-size:.9em}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-variant-numeric:tabular-nums}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  th{background:var(--bg-elev2);font-weight:600}

  /* ====== Layout ====== */
  header.app{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--bg-elev);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;backdrop-filter:saturate(140%) blur(6px);
  }
  .brand{font-weight:700;letter-spacing:.2px;font-size:15px}
  .brand .sub{font-weight:500;color:var(--fg-mute);margin-left:6px;font-size:12.5px}
  nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:thin}
  nav.tabs button{
    background:transparent;border:1px solid transparent;border-radius:8px;
    padding:7px 11px;color:var(--fg-mute);white-space:nowrap;font-weight:500
  }
  nav.tabs button:hover{color:var(--fg);background:var(--bg-hover)}
  nav.tabs button.active{color:var(--fg);background:var(--bg-elev2);border-color:var(--line)}
  .hbtns{display:flex;gap:6px}
  .hbtn{
    background:var(--bg-elev2);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;color:var(--fg-mute)
  }
  .hbtn:hover{color:var(--fg);background:var(--bg-hover)}

  main{flex:1;padding:18px;max-width:1160px;width:100%;margin:0 auto}
  .grid{display:grid;gap:14px}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:820px){
    .cols-3{grid-template-columns:1fr}
    .cols-2{grid-template-columns:1fr}
    nav.tabs button{padding:6px 9px;font-size:13px}
    main{padding:12px}
  }

  /* ====== Cards ====== */
  .card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 6px;font-size:15px;letter-spacing:.2px}
  .card h3{margin:0 0 4px;font-size:13.5px;color:var(--fg-mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .stat{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat .unit{font-size:13px;color:var(--fg-mute);font-weight:500;margin-left:4px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:var(--fg-mute)}
  .dim{color:var(--fg-dim)}
  .small{font-size:12.5px}
  .tag{
    display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:999px;
    background:var(--bg-elev2);border:1px solid var(--line);color:var(--fg-mute);
    font-weight:500;letter-spacing:.2px
  }
  .tag.accent{color:var(--accent);border-color:var(--accent-dim)}
  .tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
  .tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
  .tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}

  /* ====== Buttons ====== */
  .btn{
    background:var(--bg-elev2);border:1px solid var(--line);color:var(--fg);
    padding:8px 14px;border-radius:8px;font-weight:500
  }
  .btn:hover{background:var(--bg-hover)}
  .btn.primary{background:var(--accent);color:#0b1220;border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
  .btn.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:6px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ====== Forms ====== */
  textarea,input[type=text],input[type=password],input[type=number],select{
    width:100%;background:var(--bg-elev2);border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;color:var(--fg);outline:none
  }
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  label.field{display:block;margin:8px 0 4px;font-size:12.5px;color:var(--fg-mute);font-weight:600;letter-spacing:.3px;text-transform:uppercase}

  /* ====== Question card ====== */
  .q-prompt{font-size:15.5px;line-height:1.55;white-space:pre-wrap}
  .q-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .q-data{background:var(--bg-elev2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;overflow-x:auto}
  .q-data table{margin:0}
  .marks-pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent)}
  .marks-pill::before{content:"●";color:var(--accent);font-size:9px}
  .mp-list{margin:8px 0 0;padding:0;list-style:none}
  .mp-list li{
    display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;background:var(--bg-elev2);cursor:pointer;user-select:none
  }
  .mp-list li:hover{background:var(--bg-hover)}
  .mp-list li.hit{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 8%,var(--bg-elev2))}
  .mp-list li input{margin-top:3px}
  .mp-list li .pt{flex-shrink:0;font-size:11.5px;color:var(--fg-mute);font-weight:600;margin-top:2px;min-width:38px}
  .reveal-box{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--accent) 5%,var(--bg-elev))}
  .reveal-box h4{margin:0 0 6px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  details.expand{margin-top:8px}
  details.expand summary{cursor:pointer;color:var(--fg-mute);font-size:13px;padding:3px 0}
  details.expand[open] summary{color:var(--fg)}

  /* ====== Progress bar ====== */
  .bar{height:6px;border-radius:999px;background:var(--bg-elev2);overflow:hidden;position:relative}
  .bar > span{display:block;height:100%;background:var(--accent);transition:width .25s}
  .bar.good > span{background:var(--good)}
  .bar.warn > span{background:var(--warn)}
  .bar.bad > span{background:var(--bad)}

  /* ====== Toast & dialog ====== */
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--bg-elev);border:1px solid var(--line);padding:10px 14px;
    border-radius:10px;box-shadow:var(--shadow);z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  dialog{
    border:1px solid var(--line);background:var(--bg-elev);color:var(--fg);border-radius:14px;
    max-width:min(620px,92vw);padding:0;box-shadow:var(--shadow)
  }
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  dialog .db{padding:14px 16px;max-height:70vh;overflow:auto}
  dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  /* ====== Lecture chips ====== */
  .chip{
    display:inline-flex;align-items:center;gap:5px;padding:5px 9px;
    background:var(--bg-elev2);border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;
    color:var(--fg-mute);font-weight:500
  }
  .chip:hover{background:var(--bg-hover);color:var(--fg)}
  .chip.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg-elev2));border-color:var(--accent);color:var(--fg)}

  /* ====== Timer ====== */
  .timer{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.5px;padding:4px 10px;background:var(--bg-elev2);border:1px solid var(--line);border-radius:8px}
  .timer.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .timer.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}

  /* ====== SVG chart ====== */
  svg.chart{display:block;width:100%;height:auto}
  svg.chart .axis{stroke:var(--line-strong);stroke-width:1.2}
  svg.chart .grid{stroke:var(--line);stroke-width:.5;stroke-dasharray:2 4}
  svg.chart text{fill:var(--fg-mute);font:11px var(--sans)}
  svg.chart .curve{fill:none;stroke-width:2}

  /* ====== Section heading ====== */
  .sect-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
  .sect-head h1{margin:0;font-size:21px;letter-spacing:-.2px}
  .sect-head .crumb{color:var(--fg-dim);font-size:13px}

  /* ====== Lists ====== */
  ul.tight{margin:6px 0;padding-left:20px}
  ul.tight li{margin:3px 0}

  /* ====== Keyboard hint ====== */
  .kbds{display:inline-flex;gap:4px}
  kbd{background:var(--bg-elev2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:11.5px;color:var(--fg-mute)}

  /* ====== Confidence pills ====== */
  .conf-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .conf{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-elev2);font-weight:600;font-size:13px}
  .conf:hover{background:var(--bg-hover)}
  .conf[data-c="0"]{color:var(--bad)}
  .conf[data-c="1"]{color:var(--warn)}
  .conf[data-c="2"]{color:var(--fg)}
  .conf[data-c="3"]{color:var(--good)}

  /* ====== Score gauge ====== */
  .score{font-size:36px;font-weight:800;letter-spacing:-1px}
  .score .of{color:var(--fg-dim);font-size:18px;font-weight:500}

  /* ====== Loading / empty ====== */
  .empty{padding:32px 18px;text-align:center;color:var(--fg-mute);border:1px dashed var(--line);border-radius:12px}

  /* ====== Misc ====== */
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .nowrap{white-space:nowrap}
  .strike{text-decoration:line-through;color:var(--fg-dim)}
  .scroll-x{overflow-x:auto}

  /* print */
  @media print {
    header.app, nav.tabs, .hbtns, .btn { display:none !important }
    main { max-width: none }
    .card { box-shadow:none; border-color:#ccc }
  }
</style>
</head>
<body>
<header class="app">
  <div class="brand">CDD Revision <span class="sub">BIOL21302</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hbtns">
    <button class="hbtn" id="btn-theme" title="Toggle theme (T)">◐</button>
    <button class="hbtn" id="btn-settings" title="Settings (,)">⚙</button>
  </div>
</header>

<main id="view"></main>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dh"><strong id="dlg-title">Title</strong><button class="hbtn" onclick="document.getElementById('dlg').close()">✕</button></div>
  <div class="db" id="dlg-body"></div>
  <div class="df" id="dlg-foot"></div>
</dialog>

<script>
"use strict";

/* ========================================================================
   CDD Revision — Single-file adaptive revision app
   Data + engine + UI. No external dependencies.
   ======================================================================== */

const APP_VERSION = "1.0.0";
const LS_KEY = "cdd_revision_state_v1";

/* ----------- Lectures / topics taxonomy ----------- */
const LECTURES = {
  L02: { id:"L02", title:"Drug targets & drug discovery", short:"Targets" },
  L03: { id:"L03", title:"Agonists, inverse agonists & beyond", short:"Agonists" },
  L04: { id:"L04", title:"Molecular biology methods", short:"Mol Bio" },
  L05: { id:"L05", title:"Assay techniques", short:"Assays" },
  L06: { id:"L06", title:"Lead generation", short:"Lead Gen" },
  L07: { id:"L07", title:"Lead optimisation", short:"Lead Opt" },
  L08: { id:"L08", title:"Biomarkers", short:"Biomarkers" },
  L10: { id:"L10", title:"ADME: absorption & distribution", short:"ADME A/D" },
  L11: { id:"L11", title:"ADME: metabolism & excretion", short:"ADME M/E" },
  L12: { id:"L12", title:"Pharmacogenomics", short:"PGx" },
  L13: { id:"L13", title:"In vivo studies", short:"In vivo" },
  L14: { id:"L14", title:"Pre-clinical safety assessment", short:"Tox" },
  CASE:{ id:"CASE",title:"Integrated case studies", short:"Case" },
};
const LECTURE_ORDER = ["L02","L03","L04","L05","L06","L07","L08","L10","L11","L12","L13","L14","CASE"];

/* QBANK + CALCS + CASES are populated below by separate <script> blocks */
window.QBANK = [];
window.CALCS = [];
window.CASES = [];

</script>

<script>
/* ============================================================
   QUESTION BANK — Section A short-answer items
   Each item is a 10-mark question composed of parts (1–6 marks).
   For SR + active recall, parts are scheduled individually.
   ============================================================ */

QBANK.push(

/* ====================== L02 — Drug targets & discovery ====================== */
{
  id:"Q02-1", lecture:"L02", topic:"Drug target definition",
  prompt:"On drug targets and target selection.",
  parts:[
    { id:"Q02-1a", marks:3, type:"definition", skill:"recall",
      stem:"Define what is meant by a 'drug target' and explain the difference between on-target and off-target adverse effects.",
      points:[
        "A drug target is a specific (usually protein) molecule with which a drug interacts to produce its desired (and sometimes undesired) biological effect.",
        "On-target adverse effects arise from interaction with the intended target itself (e.g. exaggerated pharmacology).",
        "Off-target adverse effects arise from drug interacting with unintended molecules elsewhere."
      ],
      modelShort:"A specific molecule (usually a protein) the drug interacts with to produce its effect. On-target adverse effects come from the intended target; off-target effects come from binding to other molecules.",
      modelExpanded:"A drug target is the specific (usually protein) molecule with which a drug interacts to elicit its pharmacological effect. On-target adverse effects are caused by the intended interaction with that target (e.g. hypotension with antihypertensives), whereas off-target adverse effects arise from the drug binding to other, unintended molecules. The same target therefore underlies both intended efficacy and on-target toxicity, while selectivity reduces off-target effects."
    },
    { id:"Q02-1b", marks:4, type:"recall", skill:"recall",
      stem:"List FOUR criteria that define a good drug target and briefly justify each.",
      points:[
        "Efficacious — modulating it produces a meaningful change in disease processes.",
        "Safe — modulation does not cause unacceptable adverse effects.",
        "Clinically and commercially needed — addresses an unmet need with a viable market.",
        "Druggable — accessible to drug molecules and produces a measurable biological response in vitro/in vivo."
      ],
      modelShort:"Efficacious, safe, clinically/commercially needed, druggable.",
      modelExpanded:"A good drug target should be efficacious (modulation alters disease meaningfully), safe (modulation does not cause unacceptable toxicity), clinically and commercially needed (unmet need with a viable market), and druggable (accessible to drugs and able to produce a measurable biological response in vitro and in vivo)."
    },
    { id:"Q02-1c", marks:3, type:"compare", skill:"reasoning",
      stem:"Compare 'first-in-class' versus 'best-in-class' drug development strategies, including one advantage and one risk of each.",
      points:[
        "First-in-class targets a novel mechanism not previously drugged; advantage = potential blockbuster/exclusive market; risk = unproven biology, high attrition.",
        "Best-in-class targets a validated mechanism with existing drugs; advantage = lower biological risk (target already validated clinically); risk = crowded market / patent landscape and lower differentiation.",
        "Strategy choice balances scientific and commercial risk against potential reward."
      ],
      modelShort:"First-in-class = novel target; high reward, high biological risk. Best-in-class = improving on an existing drug class; lower risk but commercially crowded.",
      modelExpanded:"A first-in-class strategy targets a novel mechanism: advantage is the potential for a blockbuster with little competition, but the risk of unproven biology and clinical failure is high. A best-in-class ('me-too' / fast-follower) strategy targets a class with validated drugs and aims to improve a property (potency, half-life, side-effect profile): biological risk is lower because the target is validated, but the commercial environment is more crowded and patent/IP space is tighter."
    }
  ]
},
{
  id:"Q02-2", lecture:"L02", topic:"Phenotypic vs molecular discovery",
  prompt:"Approaches to drug target discovery, illustrated with case studies.",
  parts:[
    { id:"Q02-2a", marks:3, type:"compare", skill:"reasoning",
      stem:"Compare phenotypic and molecular approaches to drug discovery, giving one strength of each.",
      points:[
        "Phenotypic: starts from observed physiological/cellular effect; mechanism deconvoluted later. Strength = can discover first-in-class drugs without prior knowledge of target.",
        "Molecular: starts from a defined molecular target and screens for compounds modulating it. Strength = rational, hypothesis-driven; well-suited to monogenic disease.",
        "Combined approaches plus serendipity have historically been most successful."
      ],
      modelShort:"Phenotypic = observe an effect, find the target later; good for novel mechanisms. Molecular = start from a known target and screen; rational and well-defined.",
      modelExpanded:"In phenotypic discovery, compounds are screened for an observable biological effect on cells, tissues or organisms and the molecular target is deconvoluted afterwards — this approach historically yielded a disproportionate share of first-in-class drugs (e.g. Risdiplam, Ivacaftor). In the molecular approach, a defined target is identified from disease biology or genetics, and compounds are screened against that target — it is rational and hypothesis-driven, and works particularly well for monogenic Mendelian diseases (e.g. imatinib for CML). The most successful programmes combine both approaches and exploit serendipity."
    },
    { id:"Q02-2b", marks:4, type:"recall", skill:"recall",
      stem:"Outline the discovery pathway of imatinib (Glivec) as an example of a molecular-approach success.",
      points:[
        "CML is associated with the Philadelphia chromosome (t(9;22) reciprocal translocation) producing the Bcr-Abl fusion protein.",
        "Bcr-Abl is a constitutively active tyrosine kinase that drives malignant transformation; demonstrated to cause CML in mice.",
        "An in vitro kinase assay was used to screen for inhibitors; imatinib was identified in 1992 and blocked proliferation of cultured CML cells.",
        "Approved 2001 (Gleevec) and remains first-line for CML, with ~60–65% 10-year survival in responders."
      ],
      modelShort:"Philadelphia chromosome → Bcr-Abl fusion kinase identified as driver of CML → kinase inhibitor screen → imatinib identified (1992) → approved 2001 as first-line CML therapy.",
      modelExpanded:"~95% of chronic myeloid leukaemia (CML) patients carry the Philadelphia chromosome, a reciprocal t(9;22) translocation producing the Bcr-Abl fusion protein with constitutive tyrosine kinase activity that drives leukaemic transformation. Knowing this, an in vitro kinase activity assay was used as a molecular screen for Bcr-Abl inhibitors. Imatinib (STI571) was identified in 1992, blocked CML cell proliferation in culture, validated target inhibition and entered accelerated clinical trials in 1998 before approval in 2001 (Gleevec). It remains first-line therapy for CML with around 60–65% of patients achieving long-term (>10 year) survival."
    },
    { id:"Q02-2c", marks:3, type:"application", skill:"reasoning",
      stem:"Sildenafil is often described as a combination of molecular and serendipitous discovery. Explain in what sense each component applies.",
      points:[
        "Molecular component: Pfizer rationally designed a PDE5 inhibitor to raise cGMP and produce smooth-muscle relaxation, originally targeting angina.",
        "The angina trials were a clinical failure (poor anti-anginal efficacy).",
        "Serendipitous observation in the trial — male participants reported improved erectile function — led to repurposing for erectile dysfunction (approved 1998); later repurposed again for pulmonary arterial hypertension."
      ],
      modelShort:"Molecular: rationally designed PDE5 inhibitor to boost cGMP. Serendipity: angina trial failed but participants reported erectile benefit, leading to ED indication.",
      modelExpanded:"The molecular component lies in the rational design: Pfizer set out to improve on GTN's tolerance problem by inhibiting phosphodiesterase 5 (PDE5), which would slow cGMP breakdown downstream of guanylyl cyclase and prolong smooth-muscle relaxation. The serendipitous component is the observation: in angina trials sildenafil showed disappointing anti-anginal efficacy, but male participants reported improved erectile function. This unplanned phenotypic finding redirected development, and sildenafil was approved for erectile dysfunction in 1998 (and was later repurposed for pulmonary arterial hypertension). The case shows that a rationally designed molecule can still find its place through observation when the original hypothesis fails."
    }
  ]
},

/* ====================== L03 — Agonists & beyond ====================== */
{
  id:"Q03-1", lecture:"L03", topic:"Agonists & allosteric modulators",
  prompt:"On agonist behaviour at receptors. (This is the Q1 reproduced from exam-prep slides.)",
  parts:[
    { id:"Q03-1a", marks:3, type:"compare", skill:"reasoning",
      stem:"Explain the difference between full agonists, partial agonists and positive allosteric modulators (PAMs).",
      points:[
        "Full agonists produce the maximal possible response (100% Emax) at the receptor; they bind the orthosteric site with high efficacy.",
        "Partial agonists also bind the orthosteric site but have lower intrinsic efficacy — even at full receptor occupancy they produce a sub-maximal response.",
        "PAMs do not activate the receptor alone; they bind to an allosteric (distinct) site and enhance the affinity and/or efficacy of an orthosteric agonist."

      stem:`Table 3 — Ki values (nM) at all five muscarinic subtypes for two further candidates:
| Compound | M1 | M2 | M3 | M4 | M5 |
|---|---:|---:|---:|---:|---:|
| X | 50 | 600 | 8  | 60 | 75 |
| Z | 4  | 12  | 1  | 6  | 5  |
Which compound shows the most promise as a selective M3 antagonist? Justify your answer.`,

      modelExpanded:"Compound Z is the more potent M3 ligand in absolute terms (Ki = 1 nM vs 8 nM for X) but it also binds the other muscarinic subtypes strongly (M1 4 nM, M2 12 nM, M4 6 nM, M5 5 nM) — only ~5–12-fold selectivity over off-target subtypes. It is therefore effectively a pan-muscarinic antagonist and would be expected to cause widespread ACh-blockade ADRs (e.g. cognitive impairment from M1, cardiac effects from M2, salivary/exocrine effects from M3 at other sites, mood/locomotor effects from M4/M5). Compound X has weaker M3 affinity (Ki = 8 nM) but its selectivity is far better — ~75-fold over M2 (600 nM) and ~6–10-fold over M1/M4/M5. Neither compound is a 'clean' M3-selective antagonist, but X is the better starting point for further optimisation, with the explicit aim of improving selectivity over M1, M4 and M5 while retaining (or modestly improving) M3 affinity. Justification must reference the numerical ratios."

    {

      stem:"Phylos now move Compound X into preclinical PK/PD. In vitro Caco-2 permeability is moderate, hERG IC50 = 12 μM, and in rats Cl = 25 mL/min/kg, Vss = 1.8 L/kg, oral F = 28%. Briefly critique this candidate against typical CDTP criteria and propose ONE biomarker strategy for early clinical development.",
      points:[
        "Potency: Ki = 8 nM at M3 — meets typical CDTP potency criterion (nM range).",

      ],
      modelShort:"Potency ok (8 nM M3). Hits CDTP F threshold (28%) but hERG (12 μM) and short rat t½ (~50 min) are flags; non-M2 selectivity still poor. Propose a target-engagement biomarker (PET M3 radioligand displacement) to confirm engagement at safe exposures and inform Phase 1 dose.",
      modelExpanded:"Against typical CDTP criteria: potency at M3 (Ki = 8 nM) is in the desired nM range. PK: oral F of 28% just exceeds the >20% threshold; Vss = 1.8 L/kg is modest; in rat, t½ = 0.693 × Vss × bodyweight ÷ CL → ~0.693 × 1800 mL/kg / 25 mL/min/kg ≈ 50 min, which is short for once-daily dosing and may require a modified-release formulation or chemistry changes. Safety: hERG IC50 of 12 μM gives a relatively narrow window vs likely clinical free-drug Cmax and is a flag for QT liability — preferred CDTP value is >~100 μM; further structural mitigation is warranted. Selectivity over M2 (~75×) is reasonable but selectivity over M1/M4/M5 (~6–10×) is too low and predicts CNS (cognitive) and other off-target ADRs. For early clinical development, a defensible biomarker strategy would be a target-engagement biomarker using PET imaging with an M3-selective radioligand to quantify M3 occupancy at increasing doses, anchored to the desired pharmacological occupancy (analogous to the 65% D2 occupancy target for antipsychotics). This would enable early proof-of-mechanism, support dose-finding before efficacy is read out, and de-risk the cardiac/CNS safety signals by mapping receptor occupancy against drug exposure. A complementary mechanism biomarker (urodynamic detrusor function) or an outcome biomarker (incontinence episode rate) could be added in proof-of-concept trials."

<script>
/* ============================================================
   APPLICATION ENGINE
   ============================================================ */

/* ---------- State ---------- */
const DEFAULT_STATE = () => ({
  theme: "dark",
  cards: {},      // partId -> SR card
  errors: [],     // error notebook entries
  examHistory: [],
  saqHistory: [], // [{when, partId, score, total, timeMs, confidence}]
  notes: "",
  settings: {
    apiKey: "",
    apiModel: "claude-sonnet-4-6",
    askProbe: true,
    timedRecallSeconds: 90
  }
});

const STATE = (() => {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return DEFAULT_STATE();
    const parsed = JSON.parse(raw);
    return Object.assign(DEFAULT_STATE(), parsed, { settings: Object.assign(DEFAULT_STATE().settings, parsed.settings || {}) });
  } catch { return DEFAULT_STATE(); }
})();

function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ toast("Could not save state (localStorage blocked)"); } }

/* ---------- Flatten parts for SR scheduling ---------- */
const ALL_PARTS = []; // {part, parent, lecture}
for (const q of QBANK){
  for (const p of q.parts){
    ALL_PARTS.push({ part:p, parent:q, lecture:q.lecture });
  }
}
for (const c of CASES){
  for (const p of c.parts){
    ALL_PARTS.push({ part:p, parent:c, lecture:c.lecture });
  }
}
const PART_BY_ID = {};
ALL_PARTS.forEach(x => PART_BY_ID[x.part.id] = x);
const CALC_BY_ID = {};
CALCS.forEach(c => CALC_BY_ID[c.id] = c);

/* ---------- SR (SM-2 inspired) ---------- */
function getCard(id){
  if (!STATE.cards[id]){
    STATE.cards[id] = { ease:2.5, interval:0, reps:0, lapses:0, due:Date.now(), history:[], confidence:null, lastScore:null };
  }
  return STATE.cards[id];
}
/* quality: 0 = blackout, 1 = wrong but familiar, 2 = correct w/ effort, 3 = easy */
function gradeCard(id, quality, scoreFrac, timeMs){
  const c = getCard(id);
  const now = Date.now();
  c.history.push({ when: now, quality, scoreFrac, timeMs });
  c.lastScore = scoreFrac;
  c.confidence = quality;
  if (quality < 2){
    c.reps = 0;
    c.interval = 1; // 1 day
    c.lapses += 1;
    c.ease = Math.max(1.3, c.ease - 0.2);
  } else {
    c.reps += 1;
    if (c.reps === 1) c.interval = 1;
    else if (c.reps === 2) c.interval = 3;
    else c.interval = Math.round(c.interval * c.ease);
    c.ease = Math.max(1.3, c.ease + (0.1 - (3 - quality) * 0.08 + (3 - quality) * 0.02));
  }
  c.due = now + c.interval * 24 * 60 * 60 * 1000;
  saveState();
}

function dueCards(){
  const now = Date.now();
  return ALL_PARTS.filter(x => {
    const c = STATE.cards[x.part.id];
    if (!c) return true; // never seen
    return c.due <= now;
  });
}

/* ---------- Forgetting probability (rough) ---------- */
function forgettingProb(c){
  if (!c || !c.history.length) return 1;
  const sinceMs = Date.now() - (c.history[c.history.length-1].when);
  const stabilityDays = Math.max(1, c.interval);
  const sinceDays = sinceMs / 86400000;
  // Simple exponential decay: R = e^(-t/S)
  return Math.max(0, Math.min(1, 1 - Math.exp(-sinceDays / stabilityDays)));
}

/* ---------- Stats helpers ---------- */
function lectureStats(lec){
  const parts = ALL_PARTS.filter(x => x.lecture === lec);
  let seen=0, totalAcc=0, totalScore=0, totalMarks=0, accCount=0;
  for (const x of parts){
    const c = STATE.cards[x.part.id];
    if (!c || !c.history.length) continue;
    seen++;
    const last = c.history[c.history.length-1];
    if (last.scoreFrac != null){ totalAcc += last.scoreFrac; accCount++; }
    for (const h of c.history){
      if (h.scoreFrac != null){ totalScore += h.scoreFrac * x.part.marks; totalMarks += x.part.marks; }
    }
  }
  const coverage = parts.length ? seen / parts.length : 0;
  const accuracy = accCount ? totalAcc / accCount : 0;
  const mastery = coverage * accuracy; // [0,1]
  return { coverage, accuracy, mastery, seen, total: parts.length };
}

function overallReadiness(){
  let m = 0, n = 0;
  for (const lec of LECTURE_ORDER){
    const s = lectureStats(lec);
    if (s.total === 0) continue;
    m += s.mastery; n++;
  }
  return n ? m / n : 0;
}

/* ---------- Toast & dialog ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function dialog(title, bodyHtml, foot){
  const d = document.getElementById("dlg");
  document.getElementById("dlg-title").textContent = title;
  document.getElementById("dlg-body").innerHTML = bodyHtml;
  document.getElementById("dlg-foot").innerHTML = foot || `<button class="btn" onclick="document.getElementById('dlg').close()">Close</button>`;
  if (!d.open) d.showModal();
}

/* ---------- Markdown-lite for prompts (paragraphs + pipe tables) ---------- */
function escHtml(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function renderPrompt(text){
  const lines = String(text).split(/\r?\n/);
  let html = "", inTable = false, tableRows = [];
  function flushTable(){
    if (!inTable) return;
    // Build HTML table
    const rows = tableRows.filter(r => !/^\s*\|[-\s:|]+\|\s*$/.test(r));
    let h = "<div class='scroll-x'><table>";
    rows.forEach((line, idx) => {
      const cells = line.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const tag = idx === 0 ? "th" : "td";
      h += "<tr>" + cells.map(c => `<${tag}>${escHtml(c)}</${tag}>`).join("") + "</tr>";
    });
    h += "</table></div>";
    html += h;
    inTable = false; tableRows = [];
  }
  for (const ln of lines){
    if (/^\s*\|.*\|\s*$/.test(ln)){
      inTable = true; tableRows.push(ln); continue;
    } else {
      flushTable();
      if (ln.trim() === ""){ html += "<br>"; }
      else html += "<p>" + escHtml(ln) + "</p>";
    }
  }
  flushTable();
  return html;
}

/* ---------- Router / Tabs ---------- */
const VIEWS = [
  { id:"dashboard",  label:"Dashboard",  render:renderDashboard },
  { id:"due",        label:"Due now",    render:renderDue },
  { id:"practice",   label:"Practice",   render:renderPractice },
  { id:"mix",        label:"Mix mode",   render:renderMix },
  { id:"case",       label:"Case study", render:renderCase },
  { id:"calc",       label:"Calc drills",render:renderCalc },
  { id:"exam",       label:"Exam sim",   render:renderExam },
  { id:"errors",     label:"Error book", render:renderErrors },
  { id:"analytics",  label:"Analytics",  render:renderAnalytics }
];
let CURRENT_VIEW = "dashboard";

function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const v of VIEWS){
    const b = document.createElement("button");
    b.textContent = v.label;
    b.dataset.id = v.id;
    if (v.id === CURRENT_VIEW) b.classList.add("active");
    b.onclick = () => navigate(v.id);
    nav.appendChild(b);
  }
}
function navigate(id, ctx){
  CURRENT_VIEW = id;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const v = VIEWS.find(x => x.id === id);
  document.getElementById("view").innerHTML = "";
  v.render(ctx);
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const view = document.getElementById("view");
  const due = dueCards();
  const total = ALL_PARTS.length;
  const seen = ALL_PARTS.filter(x => STATE.cards[x.part.id] && STATE.cards[x.part.id].history.length).length;
  const readiness = overallReadiness();

  // Weakest 3 lectures
  const lecStats = LECTURE_ORDER.map(l => ({ lec:l, ...lectureStats(l) })).filter(s => s.total > 0);
  lecStats.sort((a,b)=>a.mastery - b.mastery);
  const weak = lecStats.slice(0,3);

  view.innerHTML = `
    <div class="sect-head">
      <h1>Dashboard</h1>
      <div class="crumb">${todayStr()} · v${APP_VERSION}</div>
    </div>

    <div class="grid cols-3" style="margin-bottom:14px">
      <div class="card">
        <h3>Predicted readiness</h3>
        <div class="stat">${(readiness*100).toFixed(0)}<span class="unit">%</span></div>
        <div class="bar ${readiness>0.7?'good':readiness>0.4?'warn':'bad'}" style="margin-top:6px"><span style="width:${(readiness*100).toFixed(1)}%"></span></div>
        <div class="small muted" style="margin-top:8px">Weighted by coverage × accuracy across all lectures.</div>
      </div>
      <div class="card">
        <h3>Due for review</h3>
        <div class="stat">${due.length}<span class="unit">items</span></div>
        <div class="small muted" style="margin-top:8px">${seen}/${total} parts attempted overall.</div>
        <div style="margin-top:10px"><button class="btn primary sm" onclick="navigate('due')">Start review</button></div>
      </div>
      <div class="card">
        <h3>Errors logged</h3>
        <div class="stat">${STATE.errors.length}</div>
        <div class="small muted" style="margin-top:8px">Targeted revision available from your slip-ups.</div>
        <div style="margin-top:10px"><button class="btn sm" onclick="navigate('errors')">Open error book</button></div>
      </div>
    </div>

    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card">
        <h3>Weakest lectures</h3>
        ${weak.length === 0 ? `<div class="muted small">No data yet — answer a few questions to populate.</div>` :
          weak.map(w => `
            <div class="spread" style="margin:8px 0">
              <div>
                <div style="font-weight:600">${LECTURES[w.lec].title}</div>
                <div class="small muted">${w.seen}/${w.total} parts seen · accuracy ${(w.accuracy*100).toFixed(0)}%</div>
              </div>
              <div style="min-width:140px">
                <div class="bar ${w.mastery>0.7?'good':w.mastery>0.4?'warn':'bad'}"><span style="width:${(w.mastery*100).toFixed(1)}%"></span></div>
                <div class="small muted" style="text-align:right;margin-top:2px">${(w.mastery*100).toFixed(0)}% mastery</div>
              </div>
            </div>
          `).join("")
        }
      </div>
      <div class="card">
        <h3>Today's focus</h3>
        <div class="row" style="margin-top:6px;flex-wrap:wrap">
          <button class="btn primary sm" onclick="navigate('mix')">Mixed retrieval</button>
          <button class="btn sm" onclick="navigate('calc')">Calculation drill</button>
          <button class="btn sm" onclick="navigate('case')">Case study</button>
          <button class="btn sm" onclick="navigate('exam')">Mock exam (90 min)</button>
        </div>
        <hr>
        <h3>Exam structure</h3>
        <ul class="tight small">
          <li><b>Section A</b> — 6 SAQs, answer 4 × 10 marks = 40/75 (~45 min)</li>
          <li><b>Section B</b> — 1 compulsory case study = 35/75 (~45 min)</li>
          <li>~1 SAQ per teaching block; subparts 1–6 marks; one relevant point ≈ one mark.</li>
          <li>Show working for calculations; <b>units are required</b> — log values without units may earn half marks.</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h3>Topic coverage</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px">
        ${LECTURE_ORDER.map(l => {
          const s = lectureStats(l);
          if (s.total === 0) return "";
          return `<div style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer" onclick="navigate('practice','${l}')">
            <div style="font-size:12px;color:var(--fg-mute);font-weight:600">${l}</div>
            <div style="font-weight:600;font-size:13.5px;line-height:1.3;min-height:34px">${LECTURES[l].short}</div>
            <div class="bar ${s.mastery>0.7?'good':s.mastery>0.4?'warn':'bad'}" style="margin-top:6px"><span style="width:${(s.mastery*100).toFixed(1)}%"></span></div>
            <div class="small muted" style="margin-top:3px">${s.seen}/${s.total}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}
function todayStr(){ const d=new Date(); return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}); }

/* ============================================================
   SAQ PART RENDER + SELF-MARK FLOW (used by Due, Practice, Mix, Errors)
   ============================================================ */
function renderPartCard(partWrap, opts){
  opts = opts || {};
  const { part, parent, lecture } = partWrap;
  const container = document.createElement("div");
  container.className = "card";
  const startMs = Date.now();
  container.dataset.partId = part.id;

  // Header
  const lecName = LECTURES[lecture] ? LECTURES[lecture].title : lecture;
  const tags = [
    `<span class="tag accent">${lecture}</span>`,
    `<span class="tag">${part.type || "—"}</span>`,
    `<span class="tag">${part.skill || "—"}</span>`,
    `<span class="tag marks-pill">${part.marks} mark${part.marks===1?'':'s'}</span>`
  ].join(" ");
  container.innerHTML = `
    <div class="q-meta">${tags}</div>
    <div class="muted small" style="margin-bottom:4px">${lecName} — ${parent.topic || parent.title || ""}</div>
    ${parent.prompt ? `<details class="expand"><summary>Question context</summary><div class="small">${renderPrompt(parent.prompt)}</div></details>` : ""}
    ${parent.scenario ? `<details class="expand" ${opts.openScenario?"open":""}><summary>Scenario / data</summary><div class="small">${renderPrompt(parent.scenario)}</div>${parent.id==='CASE-MUSC' ? doseResponseSvg() : ''}</details>` : ""}
    <div class="q-prompt" style="margin-top:8px"><b>${part.id}.</b> ${escHtml(part.stem)}</div>

    <div class="row" style="margin-top:10px">
      <button class="btn sm" data-act="timer">⏱ Timed recall (${STATE.settings.timedRecallSeconds}s)</button>
      <button class="btn sm" data-act="blank">📄 Blank-page mode</button>
      <button class="btn sm" data-act="verbal">🎙 Verbal explain</button>
      <span class="timer" data-role="timer" style="display:none">00:00</span>
    </div>

    <label class="field">Your answer</label>
    <textarea data-role="answer" rows="5" placeholder="Type your answer here. Aim for one precise scientific point per mark. Avoid vague phrases like 'helps with', 'is important'."></textarea>

    <div class="row" style="margin-top:8px;justify-content:space-between">
      <div class="row">
        <button class="btn primary sm" data-act="reveal">Reveal mark scheme &amp; self-mark</button>
        <button class="btn sm" data-act="ai">Examiner feedback (AI / copy prompt)</button>
      </div>
      <div class="row">
        <button class="btn sm ghost" data-act="skip">Skip</button>
      </div>
    </div>

    <div data-role="reveal" style="display:none"></div>
  `;

  // Event wiring
  const ta = container.querySelector("[data-role=answer]");
  const revealArea = container.querySelector("[data-role=reveal]");
  const timerEl = container.querySelector("[data-role=timer]");
  let timerInterval = null;
  let elapsed = 0;

  container.querySelector("[data-act=timer]").onclick = () => {
    const dur = STATE.settings.timedRecallSeconds;
    timerEl.style.display = "inline-block";
    let left = dur;
    timerEl.textContent = mmss(left);
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      left -= 1;
      if (left < 0){
        clearInterval(timerInterval);
        timerEl.classList.add("bad");
        timerEl.textContent = "TIME";
        revealMarkScheme();
        return;
      }
      timerEl.textContent = mmss(left);
      timerEl.classList.toggle("warn", left <= 20 && left > 10);
      timerEl.classList.toggle("bad", left <= 10);
    }, 1000);
  };

  container.querySelector("[data-act=blank]").onclick = () => {
    ta.value = "";
    ta.style.minHeight = "260px";
    ta.placeholder = "Blank-page recall — write a structured answer from scratch (no peeking).";
    ta.focus();
    toast("Blank-page mode: write a full answer before revealing.");
  };

  container.querySelector("[data-act=verbal]").onclick = () => {
    if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)){
      ta.placeholder = "Speak your answer out loud, then write a one-line summary here. (Speech recognition not available in this browser.)";
      toast("Verbal mode: explain out loud, then type a one-line summary.");
      ta.focus();
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = true;
    rec.onresult = e => {
      let final="", interim="";
      for (let i=e.resultIndex;i<e.results.length;i++){
        if (e.results[i].isFinal) final += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      ta.value = (ta.dataset.transcript || "") + final + (interim ? "\n[…] "+interim : "");
      if (final) ta.dataset.transcript = (ta.dataset.transcript || "") + final;
    };
    rec.onerror = () => toast("Speech recognition error");
    rec.start();
    toast("Listening… click Reveal when done.");
    container.querySelector("[data-act=reveal]").addEventListener("click", ()=>{ try{rec.stop()}catch{} }, { once:true });
  };

  container.querySelector("[data-act=skip]").onclick = () => {
    if (opts.onSkip) opts.onSkip();
  };

  container.querySelector("[data-act=ai]").onclick = () => openAiFeedback(part, parent, ta.value);

  function revealMarkScheme(){
    if (timerInterval) clearInterval(timerInterval);
    elapsed = Date.now() - startMs;
    revealArea.style.display = "block";
    const writingFlags = analyseWriting(ta.value);
    revealArea.innerHTML = `
      <div class="reveal-box">
        <h4>Mark scheme — tick each point you genuinely covered (≈ 1 point per mark)</h4>
        <ul class="mp-list" data-role="mp">
          ${part.points.map((p,i)=>`
            <li data-i="${i}">
              <input type="checkbox">
              <span class="pt">+${pointWorth(part, i)}</span>
              <span>${escHtml(p)}</span>
            </li>
          `).join("")}
        </ul>
        <div class="spread" style="margin-top:10px">
          <div>
            <div class="small muted">Self-estimated score</div>
            <div class="score" data-role="score">0<span class="of"> / ${part.marks}</span></div>
          </div>
          <div class="conf-row" data-role="conf">
            <button class="conf" data-c="0">Blank/Wrong</button>
            <button class="conf" data-c="1">Shaky</button>
            <button class="conf" data-c="2">Solid</button>
            <button class="conf" data-c="3">Easy</button>
          </div>
        </div>

        <details class="expand" open style="margin-top:8px">
          <summary><b>Concise ideal answer</b></summary>
          <div class="small" style="margin-top:6px">${escHtml(part.modelShort)}</div>
        </details>
        <details class="expand">
          <summary><b>Expanded high-scoring answer</b></summary>
          <div class="small" style="margin-top:6px">${escHtml(part.modelExpanded)}</div>
        </details>
        ${writingFlags.length ? `
        <details class="expand" open style="margin-top:6px">
          <summary><b>Writing coach</b> — ${writingFlags.length} flag(s)</summary>
          <ul class="tight small">${writingFlags.map(f=>`<li>${escHtml(f)}</li>`).join("")}</ul>
        </details>` : ""}
        ${STATE.settings.askProbe ? `
          <details class="expand" style="margin-top:6px">

            <div class="small" style="margin-top:6px">${escHtml(socraticProbe(part, parent))}</div>
          </details>` : ""}
      </div>
    `;

    // Score updates as boxes are ticked
    const mpItems = revealArea.querySelectorAll(".mp-list li");
    const scoreEl = revealArea.querySelector("[data-role=score]");
    mpItems.forEach(li => {
      li.onclick = (e) => {
        if (e.target.tagName !== "INPUT") li.querySelector("input").checked = !li.querySelector("input").checked;
        li.classList.toggle("hit", li.querySelector("input").checked);
        let s = 0;
        revealArea.querySelectorAll(".mp-list li").forEach((x,i)=>{
          if (x.querySelector("input").checked) s += pointWorth(part, i);
        });
        s = Math.min(s, part.marks);
        scoreEl.innerHTML = `${s}<span class="of"> / ${part.marks}</span>`;
      };
    });

    // Confidence → record + schedule
    revealArea.querySelectorAll(".conf").forEach(btn => {
      btn.onclick = () => {
        let s = 0;
        revealArea.querySelectorAll(".mp-list li").forEach((x,i)=>{
          if (x.querySelector("input").checked) s += pointWorth(part, i);
        });
        s = Math.min(s, part.marks);
        const frac = part.marks ? s / part.marks : 0;
        const q = parseInt(btn.dataset.c,10);
        gradeCard(part.id, q, frac, elapsed);
        STATE.saqHistory.push({ when: Date.now(), partId: part.id, score: s, total: part.marks, timeMs: elapsed, confidence: q });
        if (STATE.saqHistory.length > 1000) STATE.saqHistory.shift();
        if (frac < 0.6) logError(part, parent, ta.value, s, classifyError(part, ta.value, writingFlags, frac));
        saveState();
        toast(`Scored ${s}/${part.marks} · next review in ${getCard(part.id).interval} day(s)`);
        if (opts.onNext) opts.onNext();
      };
    });
  }
  container.querySelector("[data-act=reveal]").onclick = revealMarkScheme;

  partWrap._unmount = () => { if (timerInterval) clearInterval(timerInterval); };
  return container;
}
function pointWorth(part, i){
  // Default: distribute marks equally across points (≈ 1 per mark principle)
  // For multi-point sub-mark schemes we just integer-split.
  return Math.max(1, Math.round(part.marks / part.points.length));
}
function mmss(s){ const m=Math.floor(s/60), x=s%60; return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }

/* ---------- Writing coach (rule-based heuristics) ---------- */
const VAGUE_PHRASES = ["helps with","is important","is good","is bad","sort of","kind of","does stuff","things","stuff","very","really","a lot of","a bit","various","several","many","it works"];
function analyseWriting(text){
  const flags = [];
  if (!text || text.trim().length < 5) return ["No answer typed — practising retrieval requires a real attempt before revealing the scheme."];
  const t = text.toLowerCase();
  for (const v of VAGUE_PHRASES){
    if (t.includes(v)) { flags.push(`Vague phrase detected: "${v}". Replace with a precise mechanism, number, or technical term.`); break; }
  }
  const words = text.trim().split(/\s+/).length;
  if (words > 220) flags.push(`Long answer (~${words} words). Exam SAQs are 1–4 sentences per mark — be more concise.`);
  if (words < 8 && text.length > 0) flags.push("Very short answer — likely missing mark points. One precise point per mark.");
  if (/^\s*(yes|no)\b/i.test(text.trim())) flags.push("Avoid starting with 'Yes/No' — justify with mechanism.");
  if (!/\b(because|due to|via|through|by|so that|therefore|hence)\b/i.test(text) && words > 20) flags.push("No explanatory connective ('because/via/therefore') — answers often score higher when reasoning is explicit.");
  if (/\b\d+(\.\d+)?\b/.test(text) && !/(mg|kg|µ|μ|nm|nM|µM|mM|M\b|L\b|h\b|min|mL|%|mN|Da|h-?1)/.test(text)) flags.push("Numerical value without units detected — units are required for full marks in calculations.");
  return flags;
}

/* ---------- Socratic probe ---------- */
const PROBES = [
  "What experimental evidence would you cite for this?",
  "What is the main limitation of the approach you described?",
  "How would this affect trial design or dose selection?",
  "What would a regulator (MHRA/FDA) specifically worry about?",
  "How would your answer change for a biologic versus a small molecule?",
  "Which lecture topic does this most directly link to, and why?",
  "If the data went the other way, what would you conclude instead?",
  "How does this translate from a preclinical species to humans?",
  "Could this be tested earlier in development to de-risk it?",
  "What is the biomarker that would confirm your proposed mechanism?"
];
function socraticProbe(part, parent){
  // Pick a probe deterministically by part.id so the user sees variety but a stable prompt per item
  let h = 0; const s = part.id;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return PROBES[h % PROBES.length];
}

/* ---------- Error classification ---------- */
function classifyError(part, answer, writingFlags, frac){
  if (!answer || answer.trim().length < 5) return "exam-technique"; // didn't even attempt
  if (part.type === "calculation" && /units/i.test(writingFlags.join(" "))) return "calculation";
  if (part.type === "calculation") return "calculation";
  if (part.skill === "interpretation" || part.type === "interpretation") return "interpretation";
  if (writingFlags.some(f => /vague|short|concise|reasoning/i.test(f))) return "exam-technique";
  if (frac < 0.2) return "factual";
  return "conceptual";
}
function logError(part, parent, snippet, score, category){
  STATE.errors.unshift({
    when: Date.now(),
    partId: part.id,
    parentId: parent.id,
    lecture: parent.lecture || (PART_BY_ID[part.id] && PART_BY_ID[part.id].lecture),
    category,
    score,
    total: part.marks,
    snippet: (snippet || "").slice(0, 240)
  });
  if (STATE.errors.length > 200) STATE.errors.pop();
}

function renderMix(){
  const view = document.getElementById("view");
  view.innerHTML = `

          <select id="m-bias">
            <option value="due" selected>Due + weakest first</option>
            <option value="weak">Weakest topics only</option>
            <option value="random">Truly random (no bias)</option>
            <option value="errors">Past errors</option>
          </select></div>
        <div style="align-self:flex-end"><button class="btn primary" id="m-start">Start session</button></div>
      </div>
      <div class="small muted" style="margin-top:8px">Sessions interleave topics deliberately: pharmacology ↔ toxicology ↔ ADME ↔ biomarkers ↔ PGx, so adjacent items rarely come from the same lecture.</div>
    </div>
    <div id="mix-host"></div>
  `;
  view.querySelector("#m-start").onclick = () => startMix();

function startMix(){
  const view = document.getElementById("view");
  const host = view.querySelector("#mix-host");
  const len = parseInt(view.querySelector("#m-len").value, 10);
  const bias = view.querySelector("#m-bias").value;

  let pool = [];
  if (bias === "errors") pool = STATE.errors.map(e => PART_BY_ID[e.partId]).filter(Boolean);
  if (!pool.length) pool = ALL_PARTS.slice();
  // Score each item by priority
  const now = Date.now();
  const scored = pool.map(x => {
    const c = STATE.cards[x.part.id];
    const seen = c && c.history.length;
    const lastFrac = seen ? c.history[c.history.length-1].scoreFrac || 0 : 0.4;
    const overdueDays = c ? Math.max(0, (now - c.due)/86400000) : 5;
    let s = 0;
    if (bias === "due"){ s = overdueDays * 2 + (1 - lastFrac) * 3 + (seen ? 0 : 1); }
    else if (bias === "weak"){ s = (1 - lastFrac) * 4 + (seen ? 0 : 1); }
    else s = Math.random();
    s += Math.random() * 0.4; // jitter
    return { x, s };
  });
  scored.sort((a,b)=>b.s-a.s);
  // Interleave: pick top N then shuffle by alternating lectures
  let picked = scored.slice(0, len*3).map(o=>o.x);
  picked = interleaveByLecture(picked).slice(0, len);

  if (!picked.length){ host.innerHTML = `<div class="empty">No items to mix.</div>`; return; }
  host.innerHTML = `<div class="card" style="margin-bottom:14px"><h3>Session</h3><div class="small muted">${picked.length} interleaved items · <span id="mix-progress">1/${picked.length}</span></div></div><div id="mix-slot"></div>`;
  let i = 0;
  const slot = host.querySelector("#mix-slot");
  function next(){
    if (i >= picked.length){
      slot.innerHTML = `<div class="card"><h3>Session complete</h3><p class="small">Returning items to spaced-repetition queue.</p><div class="row"><button class="btn" onclick="renderMix()">Another session</button><button class="btn" onclick="navigate('analytics')">See analytics</button></div></div>`;
      return;
    }
    host.querySelector("#mix-progress").textContent = `${i+1}/${picked.length}`;
    slot.innerHTML = "";
    const card = renderPartCard(picked[i], { onNext: () => { i++; next(); }, onSkip: () => { i++; next(); }, openScenario: picked[i].lecture === "CASE" });
    slot.appendChild(card);
  }
  next();
}
function interleaveByLecture(arr){
  const buckets = {};
  for (const x of arr){ (buckets[x.lecture] = buckets[x.lecture] || []).push(x); }
  const keys = Object.keys(buckets);
  const out = [];
  let safety = arr.length * 3;
  while (safety-- > 0){
    let advanced = false;
    for (const k of keys){
      if (buckets[k].length){ out.push(buckets[k].shift()); advanced = true; }
    }
    if (!advanced) break;
  }
  return out;
}

    <div class="row"><input data-role="ans" type="text" placeholder="e.g. 3.5" style="max-width:200px"><span data-role="unit" class="muted small">${c.unit ? "units: "+escHtml(c.unit) : ""}</span></div>
    <label class="field">Working (optional)</label>
    <textarea data-role="work" rows="3" placeholder="Show your working — partial credit possible."></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn primary sm" data-act="check">Check</button>
      ${CALC_MODE !== "hidden" ? `<button class="btn sm" data-act="reveal">Reveal steps</button>` : `<button class="btn sm" data-act="reveal">Reveal full working</button>`}
    </div>
    <div data-role="out"></div>
  `;
  const ansEl = el.querySelector("[data-role=ans]");
  const workEl = el.querySelector("[data-role=work]");
  const out = el.querySelector("[data-role=out]");
  let timerInt = null, left = 90;
  if (CALC_MODE === "timed"){
    const t = el.querySelector("[data-role=ctimer]");
    timerInt = setInterval(()=>{
      left--;
      t.textContent = mmss(Math.max(0,left));
      t.classList.toggle("warn", left<=20 && left>10);
      t.classList.toggle("bad", left<=10);
      if (left <= 0){ clearInterval(timerInt); check(true); }
    }, 1000);
  }
  el.querySelector("[data-act=reveal]").onclick = () => {
    out.innerHTML = `<div class="reveal-box"><h4>Working</h4><ol class="tight small">${c.steps.map(s=>`<li>${escHtml(s)}</li>`).join("")}</ol><div class="small"><b>Answer:</b> ${c.answer} ${escHtml(c.unit)}</div></div>`;
  };
  el.querySelector("[data-act=check]").onclick = () => check(false);

  function check(timedOut){
    if (timerInt){ clearInterval(timerInt); }
    const raw = ansEl.value.trim();
    const num = parseFloat(raw.replace(/[,\s]/g,""));
    const elapsed = Date.now() - startMs;
    let feedback = [];
    let correct = false;
    if (isNaN(num)){
      feedback.push("No numeric answer entered.");
    } else {
      const close = Math.abs(num - c.answer) <= c.tolerance + 0.0001;
      correct = close;
      if (!close) feedback.push(`Numeric answer off (yours: ${num}, expected: ${c.answer} ${c.unit}).`);
    }
    const hasUnitInAns = /[a-zA-Zµμ%/]/.test(raw) || /[a-zA-Zµμ%]/.test(workEl.value);
    if (c.unit && !hasUnitInAns) feedback.push("No units stated in your answer or working — units are required for full marks.");
    if (timedOut) feedback.push("Timed out — work on speed at this question type.");

    if (feedback.length === 0) feedback.push("Correct, with units. Well done.");
    out.innerHTML = `<div class="reveal-box">
      <h4>${correct ? "Correct" : "Review"}</h4>
      <ul class="tight small">${feedback.map(f=>`<li>${escHtml(f)}</li>`).join("")}</ul>
      <details class="expand" ${correct?"":"open"}><summary>Step-by-step</summary>
        <ol class="tight small">${c.steps.map(s=>`<li>${escHtml(s)}</li>`).join("")}</ol>
      </details>
      <details class="expand"><summary>Common error types for this topic</summary>
        <ul class="tight small">${Object.entries(c.feedback).map(([k,v])=>`<li><b>${k}:</b> ${escHtml(v)}</li>`).join("")}</ul>
      </details>
    </div>`;

    const partLike = { id:c.id, marks:c.marks, points:c.steps.map((s,i)=>s), stem:c.stem, modelShort:`${c.answer} ${c.unit}`, modelExpanded:c.steps.join(" → "), type:"calculation", skill:"calculation" };
    const frac = correct ? 1 : (raw && !isNaN(num) ? 0.3 : 0);
    const q = correct ? 3 : (frac > 0 ? 1 : 0);
    gradeCard(c.id, q, frac, elapsed);
    if (!correct) logError(partLike, { id:"CALC", lecture:c.lectures[0], topic:c.topic, prompt:c.stem }, raw, frac*c.marks, "calculation");
    saveState();
  }
  return el;
}

/* Inline SVG dose-response for the muscarinic case (Drug A full, B partial, A+C shifted) */
function doseResponseSvg(){
  // Coordinates
  const w = 520, h = 320, pl = 50, pr = 18, pt = 16, pb = 38;
  const x0 = -10, x1 = -4; // log[Drug] M
  const y0 = 0, y1 = 7;    // tension mN
  function xs(v){ return pl + (v - x0) * (w - pl - pr) / (x1 - x0); }
  function ys(v){ return h - pb - (v - y0) * (h - pt - pb) / (y1 - y0); }
  function sig(emax, logEC50, points){
    const out = [];
    for (let lc = x0; lc <= x1; lc += 0.2){
      const r = emax / (1 + Math.pow(10, logEC50 - lc));
      out.push([lc, r]);
    }
    return out;
  }
  const A = sig(6.35, -7.3);
  const B = sig(2.05, -7.3);
  const Ac = sig(6.20, -6.1);
  function path(pts, color){
    return `<path class="curve" stroke="${color}" d="${pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+','+ys(p[1]).toFixed(1)).join(' ')}"/>`;
  }
  let grid = "";
  for (let x=x0;x<=x1;x++){ grid += `<line class="grid" x1="${xs(x)}" y1="${pt}" x2="${xs(x)}" y2="${h-pb}"/>`; }
  for (let y=0;y<=y1;y++){ grid += `<line class="grid" x1="${pl}" y1="${ys(y)}" x2="${w-pr}" y2="${ys(y)}"/>`; }
  let xticks = "";
  for (let x=x0;x<=x1;x++){ xticks += `<text x="${xs(x)}" y="${h-pb+14}" text-anchor="middle">${x}</text>`; }
  let yticks = "";
  for (let y=0;y<=y1;y++){ yticks += `<text x="${pl-6}" y="${ys(y)+3}" text-anchor="end">${y}</text>`; }
  return `<div style="margin-top:8px;background:var(--bg-elev2);padding:10px 12px;border:1px solid var(--line);border-radius:8px">
    <svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Dose-response curves">
      ${grid}
      <line class="axis" x1="${pl}" y1="${pt}" x2="${pl}" y2="${h-pb}"/>
      <line class="axis" x1="${pl}" y1="${h-pb}" x2="${w-pr}" y2="${h-pb}"/>
      ${xticks}
      ${yticks}
      ${path(A, "var(--accent)")}
      ${path(B, "var(--warn)")}
      ${path(Ac,"var(--accent-2)")}
      <text x="${w-pr-160}" y="${pt+14}"><tspan fill="var(--accent)">━ Drug A</tspan>  full agonist</text>
      <text x="${w-pr-160}" y="${pt+30}"><tspan fill="var(--warn)">━ Drug B</tspan>  partial agonist</text>
      <text x="${w-pr-160}" y="${pt+46}"><tspan fill="var(--accent-2)">━ Drug A + 10 nM C</tspan></text>
      <text x="${w/2}" y="${h-6}" text-anchor="middle">log[Drug] (M)</text>
      <text transform="translate(14,${h/2}) rotate(-90)" text-anchor="middle">Tension (mN)</text>
    </svg>
    <div class="small muted" style="margin-top:4px">Simulated curves illustrating the data in Tables 1 and 2.</div>
  </div>`;
}

function startExam(){
  // Sample 6 distinct SAQ items, one per lecture block where possible
  const blocks = ["L02","L03","L04","L05","L06","L07","L08","L10","L11","L12","L13","L14"];
  const byLecture = {};
  for (const b of blocks) byLecture[b] = QBANK.filter(q => q.lecture === b);
  const picked = [];
  // Shuffle blocks and pick one question each, up to 6
  const order = blocks.slice().sort(()=>Math.random()-0.5);
  for (const b of order){
    if (picked.length >= 6) break;
    if (byLecture[b].length){
      const q = byLecture[b][Math.floor(Math.random()*byLecture[b].length)];
      picked.push(q);
    }
  }
  EXAM_STATE = {
    active: true,
    started: Date.now(),
    durationMs: 90*60*1000,
    sectionA: picked,
    sectionB: CASES[0],
    selected: new Set(),
    answers: {}, // partId -> text
    selfMarks: {} // partId -> score
  };
  renderActiveExam();
}

function endExam(timedOut){
  if (!EXAM_STATE) return;
  if (EXAM_TIMER) clearInterval(EXAM_TIMER);
  const view = document.getElementById("view");
  const timeUsed = Date.now() - EXAM_STATE.started;
  view.innerHTML = `<div class="sect-head"><h1>Exam — self-mark</h1><div class="crumb">${timedOut?"Time expired · ":""}Time used: ${mmss(Math.round(timeUsed/1000))}</div></div>
    <div class="card" style="margin-bottom:14px"><div class="small">Mark each part against the official scheme. Section A only counts your 4 selected questions; if you selected fewer than 4 the first 4 marked will count (university policy).</div></div>
    <div id="mk"></div>
    <div class="card" style="margin-top:14px"><div class="row"><button class="btn primary" id="ex-submit">Finalise &amp; save attempt</button></div></div>`;
  const host = view.querySelector("#mk");
  let secAItems = EXAM_STATE.sectionA.filter(q => EXAM_STATE.selected.has(q.id));
  if (secAItems.length < 4){
    const rest = EXAM_STATE.sectionA.filter(q => !EXAM_STATE.selected.has(q.id));
    secAItems = secAItems.concat(rest).slice(0,4);
  }
  function addQ(q, sectionLabel){
    const card = document.createElement("div"); card.className = "card"; card.style.marginBottom = "12px";
    let html = `<h3>${sectionLabel}: ${q.title || q.topic}</h3>`;
    q.parts.forEach(p => {
      const userText = EXAM_STATE.answers[p.id] || "";
      html += `
        <div style="margin-top:10px">
          <div class="q-meta"><span class="tag marks-pill">${p.marks} mk</span></div>
          <div class="q-prompt small"><b>${p.id}.</b> ${escHtml(p.stem)}</div>
          <div class="small" style="border:1px solid var(--line);padding:6px 8px;border-radius:6px;margin-top:4px;white-space:pre-wrap">${escHtml(userText) || "<i class='muted'>(blank)</i>"}</div>
          <ul class="mp-list" data-role="mp" data-pid="${p.id}" data-max="${p.marks}">
            ${p.points.map((pt,i)=>`<li data-i="${i}"><input type="checkbox"><span class="pt">+${pointWorth(p,i)}</span><span>${escHtml(pt)}</span></li>`).join("")}
          </ul>
          <div class="small muted">Self-score: <b data-role="sc" data-pid="${p.id}">0</b> / ${p.marks}</div>
        </div>`;
    });
    card.innerHTML = html;
    host.appendChild(card);
    card.querySelectorAll(".mp-list").forEach(ul => {
      const pid = ul.dataset.pid;
      const max = parseInt(ul.dataset.max, 10);
      const p = findPart(pid);
      ul.querySelectorAll("li").forEach(li => {
        li.onclick = (e)=>{
          if (e.target.tagName !== "INPUT") li.querySelector("input").checked = !li.querySelector("input").checked;
          li.classList.toggle("hit", li.querySelector("input").checked);
          let s = 0;
          ul.querySelectorAll("li").forEach((x,i)=>{ if (x.querySelector("input").checked) s += pointWorth(p, i); });
          s = Math.min(s, max);
          card.querySelector(`[data-role=sc][data-pid="${pid}"]`).textContent = s;
          EXAM_STATE.selfMarks[pid] = s;
        };
      });
    });
  }
  secAItems.forEach((q, i)=>addQ(q, `Section A · Q${i+1}`));
  addQ(EXAM_STATE.sectionB, "Section B — Case study");

  view.querySelector("#ex-submit").onclick = () => {
    // Compute
    let secA = 0, secB = 0;
    secAItems.forEach(q => q.parts.forEach(p => { secA += EXAM_STATE.selfMarks[p.id] || 0; }));
    EXAM_STATE.sectionB.parts.forEach(p => { secB += EXAM_STATE.selfMarks[p.id] || 0; });
    const total = 75;
    const got = secA + secB;
    STATE.examHistory.push({ when:Date.now(), marks:got, total, sectionA:secA, sectionB:secB, timeUsed });
    // Also push items into SR system (heuristic quality from fractional score)
    secAItems.forEach(q => q.parts.forEach(p => {
      const s = EXAM_STATE.selfMarks[p.id] || 0;
      const frac = p.marks ? s / p.marks : 0;
      const q3 = frac >= 0.85 ? 3 : frac >= 0.55 ? 2 : frac >= 0.2 ? 1 : 0;
      gradeCard(p.id, q3, frac, timeUsed);
      if (frac < 0.6) logError(p, q, EXAM_STATE.answers[p.id] || "", s, "exam-technique");
    }));
    EXAM_STATE.sectionB.parts.forEach(p => {
      const s = EXAM_STATE.selfMarks[p.id] || 0;
      const frac = p.marks ? s / p.marks : 0;
      const q3 = frac >= 0.85 ? 3 : frac >= 0.55 ? 2 : frac >= 0.2 ? 1 : 0;
      gradeCard(p.id, q3, frac, timeUsed);
      if (frac < 0.6) logError(p, EXAM_STATE.sectionB, EXAM_STATE.answers[p.id] || "", s, "exam-technique");
    });
    EXAM_STATE.active = false;
    saveState();
    toast(`Saved attempt: ${got}/${total}`);
    navigate("analytics");
  };
}

  setTimeout(()=>{
    const view = document.getElementById("view");
    const slot = view.querySelector("#prac-card") || view;
    slot.innerHTML = "";
    slot.appendChild(renderPartCard(wrap, { onNext:()=>renderErrors(), onSkip:()=>{} }));
    slot.scrollIntoView({behavior:"smooth", block:"start"});
  }, 30);
}
function startTargetedRevision(){
  const ids = STATE.errors.slice(0, 12).map(e => e.partId);
  const parts = ids.map(id => PART_BY_ID[id]).filter(Boolean);
  if (!parts.length){ toast("No errors to revise."); return; }
  navigate("mix");
  setTimeout(()=>{
    const view = document.getElementById("view");
    view.querySelector("#m-bias").value = "errors";
    view.querySelector("#m-len").value = String(Math.min(parts.length, 10));
    view.querySelector("#m-start").click();
  }, 30);
}

/* ============================================================
   Analytics
   ============================================================ */
function renderAnalytics(){
  const view = document.getElementById("view");
  const total = ALL_PARTS.length;
  const seen = ALL_PARTS.filter(x => STATE.cards[x.part.id] && STATE.cards[x.part.id].history.length).length;
  const allHist = STATE.saqHistory.slice(-200);
  const avgTime = allHist.length ? allHist.reduce((s,h)=>s+h.timeMs,0) / allHist.length / 1000 : 0;
  const avgAcc = allHist.length ? allHist.reduce((s,h)=>s + (h.total ? h.score/h.total : 0),0) / allHist.length : 0;
  const lapseTop = ALL_PARTS.map(x => ({ x, c: STATE.cards[x.part.id] })).filter(o=>o.c && o.c.lapses).sort((a,b)=>b.c.lapses - a.c.lapses).slice(0,8);

  // Confidence calibration
  const calib = {0:{n:0,acc:0},1:{n:0,acc:0},2:{n:0,acc:0},3:{n:0,acc:0}};
  allHist.forEach(h => {
    if (h.confidence == null) return;
    calib[h.confidence].n++;
    calib[h.confidence].acc += h.total ? h.score/h.total : 0;
  });

  view.innerHTML = `
    <div class="sect-head"><h1>Analytics</h1><div class="crumb">Last ${allHist.length} attempts</div></div>
    <div class="grid cols-3" style="margin-bottom:14px">
      <div class="card"><h3>Coverage</h3><div class="stat">${seen}<span class="unit">/ ${total}</span></div><div class="bar" style="margin-top:6px"><span style="width:${(seen/total*100).toFixed(1)}%"></span></div></div>
      <div class="card"><h3>Avg accuracy</h3><div class="stat">${(avgAcc*100).toFixed(0)}<span class="unit">%</span></div><div class="bar ${avgAcc>0.7?'good':avgAcc>0.4?'warn':'bad'}" style="margin-top:6px"><span style="width:${(avgAcc*100).toFixed(1)}%"></span></div></div>
      <div class="card"><h3>Avg time / SAQ</h3><div class="stat">${avgTime.toFixed(0)}<span class="unit">s</span></div><div class="small muted">Exam target: SAQ subpart ≈ 1.5 min per mark.</div></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <h3>Lecture mastery</h3>
      <div class="grid" style="grid-template-columns:1fr;gap:8px;margin-top:6px">
        ${LECTURE_ORDER.map(l => {
          const s = lectureStats(l);
          if (s.total === 0) return "";
          return `<div class="spread">
            <div style="min-width:0;flex:1"><div class="small muted">${l}</div><div style="font-weight:500">${LECTURES[l].title}</div></div>
            <div style="min-width:220px;text-align:right">
              <div class="bar ${s.mastery>0.7?'good':s.mastery>0.4?'warn':'bad'}"><span style="width:${(s.mastery*100).toFixed(1)}%"></span></div>
              <div class="small muted">${(s.mastery*100).toFixed(0)}% · ${s.seen}/${s.total} seen · ${(s.accuracy*100).toFixed(0)}% acc</div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card">
        <h3>Confidence calibration</h3>
        <table>
          <tr><th>Stated confidence</th><th>n</th><th>Actual accuracy</th></tr>
          ${[0,1,2,3].map(c => `<tr><td>${["Blank/Wrong","Shaky","Solid","Easy"][c]}</td><td>${calib[c].n}</td><td>${calib[c].n ? Math.round(calib[c].acc/calib[c].n*100)+'%' : '—'}</td></tr>`).join("")}
        </table>
        <div class="small muted" style="margin-top:6px">Well-calibrated learners' accuracy rises monotonically across confidence levels.</div>
      </div>
      <div class="card">
        <h3>Recurring trouble items</h3>
        ${lapseTop.length ? lapseTop.map(o => `<div class="spread" style="border-bottom:1px solid var(--line);padding:6px 0">
            <div class="small" style="min-width:0">${o.x.lecture} · ${escHtml(o.x.part.stem.slice(0,80))}…</div>
            <div class="tag bad">${o.c.lapses} lapse${o.c.lapses>1?'s':''}</div>
          </div>`).join("") : `<div class="muted small">No recurring lapses yet.</div>`}
      </div>
    </div>

    <div class="card">
      <h3>Mock exam trend</h3>
      ${STATE.examHistory.length ?
        STATE.examHistory.slice(-10).map(e => `<div class="spread" style="border-bottom:1px solid var(--line);padding:6px 0">
          <div class="small muted">${new Date(e.when).toLocaleDateString()}</div>
          <div><b>${e.marks}/${e.total}</b> <span class="small muted">A: ${e.sectionA} · B: ${e.sectionB} · ${mmss(Math.round(e.timeUsed/1000))}</span></div>
        </div>`).join("") :
        `<div class="muted small">No mock exams completed yet — start one from the Exam Sim tab.</div>`
      }
    </div>
  `;
}

/* ============================================================
   Settings dialog
   ============================================================ */
function openSettings(){
  dialog("Settings", `
    <label class="field">Theme</label>
    <select id="set-theme">
      <option value="dark" ${STATE.theme==='dark'?'selected':''}>Dark</option>
      <option value="light" ${STATE.theme==='light'?'selected':''}>Light</option>
    </select>
    <label class="field">Anthropic API key (for AI examiner feedback)</label>
    <input id="set-key" type="password" value="${escHtml(STATE.settings.apiKey)}" placeholder="sk-ant-... (stored locally only)">
    <label class="field">AI model</label>
    <select id="set-model">
      <option value="claude-opus-4-7" ${STATE.settings.apiModel==='claude-opus-4-7'?'selected':''}>claude-opus-4-7</option>
      <option value="claude-sonnet-4-6" ${STATE.settings.apiModel==='claude-sonnet-4-6'?'selected':''}>claude-sonnet-4-6</option>
      <option value="claude-haiku-4-5-20251001" ${STATE.settings.apiModel==='claude-haiku-4-5-20251001'?'selected':''}>claude-haiku-4-5</option>
    </select>
    <label class="field"><input type="checkbox" id="set-probe" ${STATE.settings.askProbe?'checked':''}> Show Socratic probe after each answer</label>
    <label class="field">Timed-recall duration (seconds)</label>
    <input id="set-timed" type="number" min="30" max="600" value="${STATE.settings.timedRecallSeconds}">
    <hr>
    <div class="row">
      <button class="btn sm" id="exp">Export progress (JSON)</button>
      <button class="btn sm" id="imp">Import progress…</button>
      <button class="btn sm danger" id="rst">Reset all progress</button>
    </div>
    <input id="imp-file" type="file" accept="application/json" style="display:none">
  `, `
    <button class="btn" onclick="document.getElementById('dlg').close()">Cancel</button>
    <button class="btn primary" id="set-save">Save</button>
  `);
  document.getElementById("set-save").onclick = () => {
    STATE.theme = document.getElementById("set-theme").value;
    STATE.settings.apiKey = document.getElementById("set-key").value.trim();
    STATE.settings.apiModel = document.getElementById("set-model").value;
    STATE.settings.askProbe = document.getElementById("set-probe").checked;
    STATE.settings.timedRecallSeconds = Math.max(30, Math.min(600, parseInt(document.getElementById("set-timed").value,10) || 90));
    document.documentElement.dataset.theme = STATE.theme;
    saveState();
    document.getElementById("dlg").close();
    toast("Settings saved");
    navigate(CURRENT_VIEW);
  };
  document.getElementById("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(STATE, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `cdd-revision-${Date.now()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  document.getElementById("imp").onclick = () => document.getElementById("imp-file").click();
  document.getElementById("imp-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        Object.assign(STATE, data); saveState();
        toast("Progress imported"); document.getElementById("dlg").close(); navigate("dashboard");
      } catch(err){ toast("Invalid JSON"); }
    };
    r.readAsText(f);
  };
  document.getElementById("rst").onclick = () => {
    if (confirm("Reset ALL progress, errors and exam history? This cannot be undone.")){
      Object.assign(STATE, DEFAULT_STATE()); saveState();
      document.getElementById("dlg").close();
      navigate("dashboard");
      toast("Progress reset");
    }
  };
}

/* ============================================================
   Boot
   ============================================================ */
function boot(){
  document.documentElement.dataset.theme = STATE.theme || "dark";
  buildTabs();
  document.getElementById("btn-theme").onclick = () => {
    STATE.theme = STATE.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = STATE.theme;
    saveState();
  };
  document.getElementById("btn-settings").onclick = openSettings;

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "t" || e.key === "T"){ document.getElementById("btn-theme").click(); }
    if (e.key === ","){ openSettings(); }
    if (e.key === "1") navigate("dashboard");
    if (e.key === "2") navigate("due");
    if (e.key === "3") navigate("practice");
    if (e.key === "4") navigate("mix");
    if (e.key === "5") navigate("case");
    if (e.key === "6") navigate("calc");
    if (e.key === "7") navigate("exam");
    if (e.key === "8") navigate("errors");
    if (e.key === "9") navigate("analytics");
    if (e.key === "?"){
      dialog("Keyboard shortcuts", `
        <ul class="tight">
          <li><kbd>1</kbd>–<kbd>9</kbd> switch tabs (Dashboard → Analytics)</li>
          <li><kbd>T</kbd> toggle theme</li>
          <li><kbd>,</kbd> open settings</li>
          <li><kbd>?</kbd> show this help</li>
        </ul>
        <p class="small muted">Inside an answer textarea, Tab moves focus naturally; Ctrl/Cmd-Enter reveals the mark scheme.</p>
      `);
    }
  });
  document.addEventListener("keydown", (e)=>{
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){
      const btn = document.querySelector("[data-act=reveal]"); if (btn) btn.click();
    }
  });

  navigate("dashboard");
}
document.addEventListener("DOMContentLoaded", boot);
</script>
